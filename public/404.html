<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Coloridamente</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Existir um 404.html faz a Cloudflare Pages responder 404 de verdade a caminhos inexistentes
      (sem ele, qualquer URL devolve a home com 200: frames/imagens ausentes viram HTML e o
      /sitemap.xml inexistente vira "soft 404").
    -->
    <style>
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #faf9f6; color: #242424;
        font: 1rem/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 1rem; box-sizing: border-box; }
      h1 { font-family: 'Iowan Old Style', Georgia, serif; font-weight: 500; font-size: 2rem; line-height: 1.1; margin: 0 0 1rem; }
      a { color: inherit; font-weight: 600; text-underline-offset: 4px; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Página não encontrada</h1>
      <p><a href="/">Voltar para o início</a></p>
    </main>
  </body>
</html>
