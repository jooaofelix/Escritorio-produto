<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Coloridamente</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Existir um 404.html faz a Cloudflare Pages responder 404 de verdade a caminhos inexistentes
      (sem ele, qualquer URL devolve a home com 200: frames/imagens ausentes viram HTML e o
      /sitemap.xml inexistente vira "soft 404").
    -->
    <style>
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #faf9f5; color: #262624;
        font: 1rem/1.6 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 1rem; box-sizing: border-box; }
      h1 { font-weight: 900; font-size: 2.25rem; line-height: 1.1; margin: 0 0 1.5rem; }
      a { display: inline-block; background: #e98071; color: #262624; font-weight: 700; text-decoration: none;
        padding: 0.8rem 1.5rem; border-radius: 999px; margin-right: 0.5rem; margin-top: 0.5rem; }
      a:hover { background: #e06a58; }
      a:focus-visible { outline: 2px solid #262624; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo-coloridamente.svg" alt="Coloridamente" width="868" height="352" style="height:56px;width:auto;margin:0 0 2rem" />
      <h1>Página não encontrada</h1>
      <p><a href="/">Página institucional</a><a href="/cinematografico/">Experiência</a></p>
    </main>
  </body>
</html>
